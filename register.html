<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kofkro LMIS — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0b3866;--sky:#1ba9e8;--top:#0f1c2e;--ink:#111827;--mute:#687386;--line:#dfe5ec;--bg:#f4f7fb;--card:#fff;box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}html,body{min-height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.6 "Open Sans",system-ui,sans-serif}a{color:var(--sky);text-decoration:none}.topbar{height:72px;background:var(--top);color:#fff}.topbar-inner{max-width:1180px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 25px Quicksand,sans-serif;color:#fff}.brand span{color:#5bc4f3;margin-left:5px}.back{color:#fff;font-size:14px;padding:8px 13px;border:1px solid rgba(255,255,255,.3);border-radius:4px}.back:hover{background:rgba(255,255,255,.08)}.auth-shell{min-height:calc(100vh - 122px);display:grid;place-items:center;padding:56px 20px}.auth-card{width:min(100%,470px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 45px rgba(11,56,102,.11);padding:38px 40px}.auth-copy{text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--sky));color:#fff;font:700 27px Quicksand,sans-serif}.auth-card h1{font:700 30px Quicksand,sans-serif;margin:0 0 8px;color:#172033}.auth-copy p{margin:0 auto 28px;color:var(--mute);max-width:390px}.auth-form{display:grid;gap:9px}.auth-form label{font-weight:600;font-size:14px}.label-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.label-row a{font-size:13px;font-weight:600}input[type=email],input[type=password],input[type=text]{width:100%;height:48px;border:1px solid #cfd7e2;border-radius:5px;background:#fff;color:var(--ink);padding:0 14px;font:inherit;outline:none}input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(27,169,232,.12)}.password-wrap{position:relative}.password-wrap input{padding-right:65px}.password-wrap button{position:absolute;right:9px;top:7px;height:34px;border:0;background:transparent;color:var(--navy);font-weight:700;cursor:pointer}.remember{display:flex;align-items:center;gap:8px;margin:7px 0 10px;color:#4b5563;font-weight:400!important}.remember input{accent-color:var(--navy)}.primary,.secondary{width:100%;height:48px;border-radius:5px;display:grid;place-items:center;font:600 15px "Open Sans",sans-serif;cursor:pointer}.primary{border:0;background:var(--navy);color:#fff}.primary:hover{background:#092d52}.secondary{border:1px solid #b9c5d4;background:#fff;color:var(--navy)}.secondary:hover{background:#f6f9fc}.message{margin:4px 0 0;padding:10px 12px;border-radius:5px;background:#fff1f1;color:#b42318;border:1px solid #f3c3c0}.message.ok{background:#effaf4;color:#16734a;border-color:#b9e4cd}.divider{display:flex;align-items:center;gap:12px;color:#8792a3;font-size:13px;margin:27px 0 14px}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.terms{text-align:center;color:#8a94a5;font-size:12px;margin:17px 0 0}footer{text-align:center;background:#0f1c2e;color:#8e98a8;padding:22px 16px;font-size:13px}@media(max-width:560px){.topbar{height:62px}.topbar-inner{padding:0 16px}.brand{font-size:22px}.back{font-size:13px}.auth-shell{padding:28px 14px}.auth-card{padding:30px 22px;border-radius:8px}.auth-card h1{font-size:27px}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="marketing.html">Kofkro<span>LMIS</span></a>
    <a class="back" href="login.html">Sign in</a>
  </div>
</header>

<main class="auth-shell">
  <section class="auth-card">
    <div class="auth-copy">
      <div class="mark">K</div>
      <h1>Create your account</h1>
      <p>Join the Kofkro LMIS to build your profile and access jobs, internships and apprenticeships.</p>
    </div>

    <form id="registerForm" class="auth-form">
      <label for="name">Full name</label>
      <input id="name" type="text" required autocomplete="name" placeholder="Your full name">

      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">

      <label for="role">I am a</label>
      <select id="role" style="height:48px;border:1px solid #cfd7e2;border-radius:5px;padding:0 14px;font:inherit;background:#fff">
        <option value="candidate">Job seeker / candidate</option>
        <option value="employer">Employer / organisation</option>
        <option value="training_provider">Training provider</option>
      </select>

      <button class="primary" type="submit">Create account</button>
      <p id="message" class="message" hidden></p>
    </form>

    <p class="terms">Passwords are hashed before they are saved in this browser. Accounts are stored on this device only.</p>
  </section>
</main>

<footer>© 2026 Kofkro LMIS · Kofkro Municipality, Ghana</footer>

<script>
(function () {

/* LOCAL STORAGE LAYER (same block in every page) */
var K = { U: 'kofkro_users', J: 'kofkro_jobs', S: 'kofkro_session' };
function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert('Browser storage is full or blocked.'); } }
function currentUser() {
  var id = sessionStorage.getItem(K.S) || localStorage.getItem(K.S);
  return load(K.U, []).find(function (u) { return String(u.id) === id; }) || null;
}
async function hashPw(s) {
  try {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  } catch (e) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'x' + h;
  }
}
function setSession(id, remember) {
  sessionStorage.removeItem(K.S); localStorage.removeItem(K.S);
  (remember ? localStorage : sessionStorage).setItem(K.S, String(id));
}

/* PAGE */
if (currentUser()) { location.replace('index.html'); return; }

document.getElementById('registerForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var form = e.target,
      message = document.getElementById('message'),
      button = form.querySelector('button');

  function show(text, ok) {
    message.hidden = false;
    message.className = 'message' + (ok ? ' ok' : '');
    message.textContent = text;
  }

  message.hidden = true;

  var name = document.getElementById('name').value.trim(),
      email = document.getElementById('email').value.trim().toLowerCase(),
      pw = document.getElementById('password').value,
      role = document.getElementById('role').value;

  if (!name || !email) { show('Please fill in all fields.'); return; }
  if (pw.length < 8) { show('Password must be at least 8 characters.'); return; }

  var users = load(K.U, []);
  if (users.some(function (u) { return u.email === email; })) {
    show('An account with that email already exists.');
    return;
  }

  button.disabled = true;
  button.textContent = 'Creating account…';

  var u = { id: Date.now(), name: name, email: email, role: role, pw: await hashPw(pw) };
  users.push(u);
  save(K.U, users);
  setSession(u.id, true);

  show('Account created. Redirecting…', true);
  setTimeout(function () { location.href = 'index.html'; }, 500);
});

})();
</script>
</body>
</html>
